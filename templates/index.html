<!DOCTYPE html>
<html>
<head>
    <title>Emotion Detector</title>
    <style>
        body { text-align: center; background: #f2f2f2; font-family: Arial; }
        #video-box { margin-top: 20px; }
        button {
            padding: 12px 20px;
            margin: 10px;
            font-size: 18px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
        }
        #start { background: green; color: white; }
        #stop { background: red; color: white; }
        #snap { background: blue; color: white; }
        #report { background: orange; color: black; }
    </style>
</head>

<body>

    <h1>Emotion Detection System</h1>

    <div>
        <button id="start">Start Detection</button>
        <button id="stop">Stop Detection</button>
        <button id="snap">Snap</button>
        <button id="report">Report</button>
    </div>

    <div id="video-box">
        <img id="video" width="640" height="480" src="">
    </div>

    <script>
        const video = document.getElementById("video");

        // Start Webcam
        document.getElementById("start").onclick = function () {
            video.src = "/video_feed";
        };

        // Stop Webcam
        document.getElementById("stop").onclick = function () {
            video.src = "";
        };

        // Take Snapshot
        document.getElementById("snap").onclick = function () {
            window.location.href = "/snapshot";
        };

        // Generate Report
        document.getElementById("report").onclick = function () {
            window.location.href = "/report";
        };
    </script>

</body>
</html>
